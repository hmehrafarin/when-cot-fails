repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  # mypy and deptry run inside the project environment so they see the real
  # dependency types instead of an isolated stub-less environment.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --quiet mypy --config-file=pyproject.toml ri
        language: system
        pass_filenames: false
        files: ^ri/.*\.py$
      - id: deptry
        name: deptry
        entry: uv run --quiet deptry .
        language: system
        pass_filenames: false
        always_run: true
