[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "when-cot-fails"
version = "0.2.0"
description = "Activation patching of chain-of-thought hidden states on GSM8K (code for the paper 'When Chain-of-Thought Fails, the Solution Hides in the Hidden States')"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Houman Mehrafarin" }]
license = { text = "MIT" }
dependencies = [
  "transformers>=4.56",
  "accelerate",
  "datasets",
  "pandas",
  "numpy",
  "torch>=2.2,<2.6",
  "tqdm",
  "pydantic>=2.13.2",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "wandb>=0.26.0",
]

[project.urls]
Repository = "https://github.com/hmehrafarin/when-cot-fails"
Issues = "https://github.com/hmehrafarin/when-cot-fails/issues"

[project.scripts]
ri = "ri.main:main"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ri", "ri.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml"]

[project.optional-dependencies]
analysis = ["spacy>=3.8,<3.9", "matplotlib"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "codespell>=2.3",
  "deptry>=0.20",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["outputs", "wandb", "multirun"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "SIM",       # flake8-simplify
  "RUF",       # ruff-specific
  "PL",        # pylint
  "PERF",      # perflint
]
ignore = [
  "E501",      # line length (formatter handles it)
  "PLR0913",   # too many arguments
  "PLR2004",   # magic values
  "PERF203",   # try/except in loop (common pattern for per-sample error handling)
]

[tool.ruff.lint.per-file-ignores]
# Hydra dispatcher uses lazy imports per task branch to keep startup fast.
"ri/main.py" = ["PLC0415"]

[tool.ruff.lint.pylint]
max-branches = 35
max-returns = 15
max-statements = 150

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["outputs/", "wandb/", "multirun/"]

[tool.codespell]
skip = "*.lock,*.json,./.git,./outputs,./wandb,./multirun"
ignore-words-list = "nd,te,ans"

[tool.deptry]
known_first_party = ["ri"]
ignore_notebooks = true

[tool.deptry.per_rule_ignores]
DEP002 = [
  # Used by transformers at runtime for device_map="auto"; never imported directly.
  "accelerate",
  # Imported only under TYPE_CHECKING (ri/tracking.py), which deptry cannot see.
  "matplotlib",
]
